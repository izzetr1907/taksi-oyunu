<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1020">
<title>Taksi Durağı</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect rx='12' width='64' height='64' fill='%23ffc400'/><text x='32' y='44' text-anchor='middle' font-size='36'>🚕</text></svg>">
<style>
:root {
  --navy:#0a1020; --navy-1:#0e1628; --navy-2:#141c32; --navy-3:#1c2744; --navy-4:#263556;
  --line:rgba(255,196,0,.18); --yellow:#ffc400; --yellow-2:#ffd54a; --yellow-d:#c49200;
  --text:#f3efe4; --muted:#9aa3b8; --dim:#6d7690; --green:#3ddc84; --red:#ff5c6a;
  --blue:#5ab0ff; --orange:#ff9a3c; --purple:#b59bff;
  --shadow:0 8px 24px rgba(0,0,0,.4); --radius:14px;
  --top:42px; --banner:26px; --nav:58px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#070b14;color:var(--text);
  font-family:"Noto Sans","DejaVu Sans","Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
#app{position:relative;width:100%;height:100%;max-width:1200px;margin:0 auto;background:var(--navy);overflow:hidden}

/* START */
#screen-start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 20%,#1e2a4a 0%,#0a1020 55%,#070b14 100%);z-index:20;overflow:hidden}
.start-art{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none}
.start-road{position:absolute;bottom:0;left:0;right:0;height:58px;background:#151b28;border-top:3px solid #2a3144;overflow:hidden}
.start-road::after{content:"";position:absolute;top:26px;left:-20%;right:-20%;height:4px;
  background:repeating-linear-gradient(90deg,var(--yellow) 0 28px,transparent 28px 52px);animation:dashes 1.4s linear infinite}
@keyframes dashes{to{transform:translateX(-52px)}}
.start-hero{position:relative;z-index:2;text-align:center;margin-top:-8vh;padding:0 20px}
.logo-light{width:54px;height:22px;margin:0 auto 8px;background:var(--yellow);border-radius:4px 4px 2px 2px;
  box-shadow:0 0 18px var(--yellow),0 0 40px rgba(255,196,0,.4);animation:blink 2.4s ease-in-out infinite;position:relative}
.logo-light::before,.logo-light::after{content:"";position:absolute;top:4px;width:10px;height:10px;background:#1a1400;border-radius:1px}
.logo-light::before{left:8px}.logo-light::after{right:8px}
@keyframes blink{0%,70%,100%{filter:brightness(1)}80%{filter:brightness(.45)}}
.start-hero h1{font-size:clamp(28px,6vw,46px);letter-spacing:.18em;font-weight:800;color:var(--yellow);
  text-shadow:0 2px 0 var(--yellow-d),0 8px 24px rgba(255,196,0,.25)}
.start-hero h1 span{display:block;letter-spacing:.42em;font-size:.42em;color:var(--text);font-weight:600;margin-top:2px;opacity:.9}
.start-hero p.tag{color:var(--muted);margin:8px 0 18px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.start-card{background:rgba(20,28,50,.86);border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px;
  width:min(360px,86vw);box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.start-card label{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;text-align:left}
.start-card input{width:100%;background:#0c1322;border:1px solid var(--navy-4);border-radius:10px;padding:10px 12px;outline:none;font-size:16px;margin-bottom:12px}
.start-card input:focus{border-color:var(--yellow)}
.start-actions{display:flex;flex-direction:column;gap:8px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;
  border-radius:12px;font-weight:700;letter-spacing:.02em;transition:transform .12s,filter .12s,background .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.45;pointer-events:none}
.btn-y{background:linear-gradient(180deg,var(--yellow-2),var(--yellow));color:#1a1400;box-shadow:0 4px 0 var(--yellow-d),0 6px 16px rgba(255,196,0,.28)}
.btn-y:active{box-shadow:0 1px 0 var(--yellow-d)}
.btn-g{background:var(--navy-3);color:var(--text);border:1px solid var(--line)}
.btn-d{background:#3a1d28;color:#ffb3bc;border:1px solid rgba(255,92,106,.35)}
.btn-ok{background:linear-gradient(180deg,#55e996,var(--green));color:#062416}
.btn-sm{min-height:36px;padding:0 10px;font-size:12px;border-radius:9px}
.btn-xs{min-height:30px;padding:0 8px;font-size:11px;border-radius:8px}
.btn-block{width:100%}

/* SHELL */
#screen-game{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--navy)}
#topbar{height:calc(var(--top) + var(--safe-t));padding:var(--safe-t) 10px 0 10px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,#12182c,#0e1526);border-bottom:1px solid var(--line);flex-shrink:0;z-index:8}
.tb-player{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,var(--yellow),#c49200);
  display:grid;place-items:center;font-size:16px;box-shadow:0 0 0 2px rgba(255,196,0,.25);flex-shrink:0}
.tb-meta{min-width:0}
.tb-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-level{font-size:10px;color:var(--yellow);display:flex;align-items:center;gap:6px}
.xp-bar{width:64px;height:5px;background:#2a3458;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#fff3b0);border-radius:4px}
.tb-cash{background:#121a14;border:1px solid rgba(61,220,132,.3);color:var(--green);font-weight:800;font-size:13px;
  padding:5px 10px;border-radius:999px;white-space:nowrap;letter-spacing:.02em;position:relative}
.tb-cash.neg{background:#2a1216;border-color:rgba(255,92,106,.4);color:var(--red)}
.tb-time{text-align:right;font-variant-numeric:tabular-nums}
.tb-time .day{font-size:10px;color:var(--muted)}
.tb-time .clock{font-size:14px;font-weight:700;letter-spacing:.04em}
.icon-btn{width:34px;height:34px;border-radius:10px;background:var(--navy-3);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;flex-shrink:0}
#event-banner{height:var(--banner);flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:11px;font-weight:600;letter-spacing:.03em;background:linear-gradient(90deg,#3a2a00,#5a4300,#3a2a00);
  color:var(--yellow-2);border-bottom:1px solid rgba(255,196,0,.2);overflow:hidden;white-space:nowrap}
#event-banner .dot{width:7px;height:7px;border-radius:50%;background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:blink 1.6s infinite}
#view{flex:1;min-height:0;position:relative;overflow:hidden;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bottomnav{height:calc(var(--nav) + var(--safe-b));padding:0 4px var(--safe-b);display:flex;align-items:stretch;justify-content:space-around;
  background:#0c1220;border-top:1px solid var(--line);flex-shrink:0;z-index:8}
#bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--dim);font-size:9px;font-weight:600;letter-spacing:.02em;min-width:0}
#bottomnav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bottomnav button.on{color:var(--yellow)}
#bottomnav button.on svg{fill:rgba(255,196,0,.15)}

/* SHARED */
.view-pad{height:100%;overflow:auto;padding:8px 10px 10px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--navy-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.card h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow);margin-bottom:6px}
.muted{color:var(--muted);font-size:12px}.dim{color:var(--dim);font-size:11px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.04em}
.pill-y{background:rgba(255,196,0,.15);color:var(--yellow)}
.pill-g{background:rgba(61,220,132,.15);color:var(--green)}
.pill-r{background:rgba(255,92,106,.15);color:var(--red)}
.pill-b{background:rgba(90,176,255,.15);color:var(--blue)}
.pill-o{background:rgba(255,154,60,.15);color:var(--orange)}
.pill-p{background:rgba(181,155,255,.15);color:var(--purple)}
.bar{height:7px;background:#1a2238;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--green)}
.bar.warn i{background:var(--orange)}.bar.bad i{background:var(--red)}
.tabs{display:flex;gap:4px;background:#0c1322;padding:3px;border-radius:10px;margin-bottom:8px}
.tabs button{flex:1;min-height:32px;border-radius:8px;font-size:12px;font-weight:700;color:#c5cde0}
.tabs button.on{background:var(--navy-3);color:var(--yellow);box-shadow:inset 0 0 0 1px var(--line)}
.list{display:flex;flex-direction:column;gap:8px}
.money{color:var(--green);font-weight:800}.money.out{color:var(--red)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:#0c1322;border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:14px}.stat span{font-size:10px;color:var(--muted)}

/* STREET */
#view-durak{height:100%;display:grid;grid-template-rows:1fr auto}
.street{position:relative;overflow:hidden;background:#1a2740}
.sky{position:absolute;inset:0 0 34% 0;transition:background 1.2s}
.sky.dawn{background:linear-gradient(#f3a26a,#7ea0c8 55%,#c9d6e8)}
.sky.day{background:linear-gradient(#5aa0e0,#9ec8f0 60%,#cfe4f8)}
.sky.dusk{background:linear-gradient(#f08a4b,#c45d6a 40%,#4a3a6a 80%,#2a2a44)}
.sky.night{background:linear-gradient(#070b18,#10182e 60%,#1a2240)}
.celestial{position:absolute;width:28px;height:28px;border-radius:50%;right:14%;top:12%;box-shadow:0 0 24px currentColor}
.sky.day .celestial,.sky.dawn .celestial{background:#ffe680;color:#ffe680}
.sky.dusk .celestial{background:#ffd0a0;color:#ffb070;top:20%}
.sky.night .celestial{background:#f0f3ff;color:#c8d4ff;box-shadow:0 0 16px #fff,-8px 4px 0 -2px #10182e}
.stars{position:absolute;inset:0;opacity:0;transition:opacity 1s;pointer-events:none;
  background-image:radial-gradient(1px 1px at 10% 20%,#fff 50%,transparent),radial-gradient(1px 1px at 30% 40%,#fff 50%,transparent),
    radial-gradient(1.5px 1.5px at 70% 15%,#fff 50%,transparent),radial-gradient(1px 1px at 85% 35%,#fff 50%,transparent),
    radial-gradient(1px 1px at 50% 25%,#fff 50%,transparent),radial-gradient(1px 1px at 20% 60%,#fff 50%,transparent)}
.sky.night .stars{opacity:.85}
.cloud{position:absolute;background:rgba(255,255,255,.55);border-radius:40px;height:14px;animation:cloud 60s linear infinite}
.sky.night .cloud{opacity:.15}
@keyframes cloud{from{transform:translateX(-40px)}to{transform:translateX(120vw)}}
.skyline-far{position:absolute;left:-10%;right:-10%;bottom:34%;height:38%;opacity:.55;animation:drift 50s linear infinite alternate}
.skyline-mid{position:absolute;left:0;right:0;bottom:32%;height:46%}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(16px)}}
.bldg{position:absolute;bottom:0;background:linear-gradient(#2b3654,#1a2238);border-top:2px solid rgba(255,255,255,.06)}
.bldg::after{content:"";position:absolute;inset:6px 5px;background:repeating-linear-gradient(to bottom,#d7c07a 0 4px,transparent 4px 11px);
  background-size:8px 11px;opacity:.25}
.sky.night .bldg::after,.sky.dusk .bldg::after{opacity:.85;background:repeating-linear-gradient(to right,#ffd978 0 5px,transparent 5px 11px),
  repeating-linear-gradient(to bottom,#ffd978 0 4px,transparent 4px 11px);background-blend-mode:multiply}
.mosque{position:absolute;bottom:0;z-index:2;pointer-events:none}
.water{position:absolute;right:0;top:30%;width:22%;height:36%;background:linear-gradient(90deg,transparent,rgba(70,140,190,.4));
  pointer-events:none;overflow:hidden}
.sky.night .water{background:linear-gradient(90deg,transparent,rgba(30,70,110,.5))}
.water i{position:absolute;left:0;right:0;height:2px;background:rgba(200,230,255,.25);animation:wave 4s linear infinite}
@keyframes wave{from{transform:translateY(0);opacity:.2}to{transform:translateY(30px);opacity:0}}
.street-road{position:absolute;left:0;right:0;bottom:0;height:30%;background:#1c2333;border-top:4px solid #323a4e;overflow:hidden}
.street-road .lane{position:absolute;top:46%;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,#c8b24a 0 18px,transparent 18px 34px);animation:lanemove 1s linear infinite}
@keyframes lanemove{to{transform:translateX(-34px)}}
.sidewalk{position:absolute;left:0;right:0;bottom:30%;height:6%;background:#2a3144;border-top:2px solid #3c4560}
.stand-pole{position:absolute;bottom:32%;left:8%;width:6px;height:42%;background:#1a1a1a;z-index:3}
.stand-sign{position:absolute;bottom:66%;left:4%;width:72px;z-index:4;background:var(--yellow);color:#1a1400;
  font-weight:900;font-size:11px;letter-spacing:.08em;text-align:center;padding:5px 4px 4px;border-radius:3px;
  box-shadow:0 4px 0 #a87e00,0 0 16px rgba(255,196,0,.35);line-height:1.15}
.stand-sign small{display:block;font-size:8px;letter-spacing:.16em}
.lamp{position:absolute;bottom:32%;width:5px;height:36%;background:#1c1c22;z-index:3}
.lamp::after{content:"";position:absolute;top:-6px;left:-8px;width:22px;height:10px;background:#2a2a30;border-radius:4px 4px 8px 8px}
.lamp .glow{position:absolute;top:0;left:50%;width:90px;height:90px;transform:translateX(-50%);
  background:radial-gradient(ellipse at top,rgba(255,210,100,.4),transparent 70%);opacity:0;pointer-events:none;transition:opacity .8s}
.sky.night .lamp .glow,.sky.dusk .lamp .glow{opacity:1}
.taxi-park{position:absolute;bottom:4%;left:16%;z-index:5}
.pax-wait{position:absolute;bottom:32%;z-index:4;display:flex;gap:4px;align-items:flex-end}
.tree{position:absolute;bottom:32%;z-index:2;width:8px;height:22%;background:#3a2a18}
.tree::after{content:"";position:absolute;left:50%;bottom:60%;width:36px;height:36px;border-radius:50%;background:#2d5a38;transform:translateX(-50%)}
.sky.night .tree::after{background:#1a3520}
.traffic{position:absolute;bottom:6%;z-index:4;animation:pass 9s linear infinite}
.traffic.b{animation-duration:13s;animation-delay:-4s;bottom:14%;transform:scale(.75);opacity:.85}
@keyframes pass{from{left:110%}to{left:-25%}}
.stand-chip{position:absolute;top:8px;right:8px;z-index:6;background:rgba(10,16,32,.78);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;backdrop-filter:blur(6px)}
.durak-dock{display:grid;grid-template-columns:1.15fr 1fr auto;gap:8px;padding:8px 10px;background:linear-gradient(180deg,#12182c,#0c1220);
  border-top:1px solid var(--line);align-items:stretch}
.quest-card,.daily-card{background:var(--navy-2);border:1px solid var(--line);border-radius:12px;padding:7px 9px;min-width:0}
.q-kicker{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow);font-weight:700}
.q-title{font-size:12px;font-weight:700;margin-top:2px}
.q-prog{font-size:10px;color:var(--muted);margin-top:2px}
.daily-item{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;font-weight:600;margin-top:3px}
.daily-item.done{color:var(--green);text-decoration:line-through}
.yolcu-btn{min-width:132px;min-height:64px;flex-direction:column;gap:2px;border-radius:14px;font-size:15px}
.yolcu-btn small{font-size:11px;font-weight:700;opacity:.8}

/* RIDE */
#ride{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;background:#0b101c}
#ride.hidden{display:none!important}
.interior{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.windshield{position:relative;flex:1;min-height:80px;margin:0 18px 0;background:#2a4060;border-radius:0 0 40% 40%/0 0 14% 14%;
  overflow:hidden;box-shadow:inset 0 -20px 30px rgba(0,0,0,.25),0 0 0 6px #1a1520}
.ws-sky{position:absolute;inset:0 0 36% 0}
.ws-city{position:absolute;left:-20%;right:-20%;bottom:36%;height:36%;animation:none}
.ws-city.run{animation:scenery 3s linear infinite}
@keyframes scenery{to{transform:translateX(-40px)}}
.ws-road{position:absolute;left:0;right:0;bottom:0;height:42%;background:#2a3140;clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}
.ws-lane{position:absolute;left:50%;top:0;width:6px;height:100%;background:repeating-linear-gradient(180deg,#d8c25a 0 12px,transparent 12px 26px);
  transform:translateX(-50%)}
.ws-lane.run{animation:lanerun .35s linear infinite}
@keyframes lanerun{to{transform:translateX(-50%) translateY(26px)}}
.mirror{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:86px;height:36px;background:#111;border:3px solid #2a2a30;
  border-radius:8px;overflow:hidden;z-index:5;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.mirror small{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:6px;color:#888;letter-spacing:.08em}
.dash{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 14px 8px;background:linear-gradient(#2a2030,#121018);border-top:8px solid #3a2a22}
.wheel-shape{position:relative;width:52px;height:52px;flex-shrink:0;border:6px solid #1a1a1a;border-radius:50%;
  background:#2a2a2e;box-shadow:inset 0 0 0 8px #3a3a40,0 0 0 2px #111}
.wheel-shape::after{content:"";position:absolute;inset:12px;border-radius:50%;background:#161616}
.meter{position:relative;width:110px;height:42px;flex-shrink:0;background:#0a0c08;border:2px solid #3a3a20;border-radius:6px;
  color:#7CFF6B;font-family:"Courier New","Noto Sans",monospace;font-weight:700;font-size:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;letter-spacing:.06em;
  box-shadow:inset 0 0 12px #0410,0 0 8px rgba(124,255,107,.2)}
.meter small{font-size:8px;color:#6a8a5a;letter-spacing:.14em}
.mood{flex:1;min-width:70px}
.mood label{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.pax-seat{position:relative;display:flex;align-items:center;gap:8px;text-align:left}
.pax-ava{width:48px;height:48px;border-radius:50%;margin:0;background:#3a2a22;border:3px solid var(--yellow);
  box-shadow:0 6px 16px rgba(0,0,0,.4);display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.pax-name{font-size:11px;font-weight:700;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:999px}
.pax-type{display:block;font-size:9px;color:var(--yellow);font-weight:700;letter-spacing:.04em}
.ride-ui{padding:8px 12px 10px;background:#0c1220;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ride-prog-wrap{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.ride-prog{flex:1;height:10px;background:#1a2238;border-radius:8px;overflow:hidden}
.ride-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--green));border-radius:8px}
.bubble{background:var(--navy-3);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:8px 10px;font-size:13px}
.choices{display:flex;flex-direction:column;gap:6px}
.choices button,.choice-row button{text-align:left;background:var(--navy-2);border:1px solid var(--line);border-radius:10px;
  padding:8px 12px;min-height:40px;font-size:13px;font-weight:600}
.choices button:active,.choice-row button:active{border-color:var(--yellow);background:#243050}
.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.choice-row.three{grid-template-columns:1fr 1fr 1fr}
.tap-game{background:#1a1520;border:1px solid var(--yellow);border-radius:12px;padding:8px 10px 10px}
.tg-title{font-size:12px;font-weight:800;color:var(--yellow);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.tap-track{position:relative;height:22px;background:#0c0e16;border-radius:8px;overflow:hidden}
.tap-track .zone{position:absolute;top:0;bottom:0;background:rgba(61,220,132,.45)}
.tap-track .needle{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 8px #fff}
.stars-row{color:var(--yellow);letter-spacing:2px;font-size:18px}

/* MAP / LISTS */
.map-layout{height:100%;display:grid;grid-template-columns:1.4fr 1fr;gap:8px;padding:8px}
.map-board{position:relative;background:#122033;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bosphorus{position:absolute;top:0;bottom:0;left:44%;width:10%;background:linear-gradient(90deg,#1a3a52,#2a6a88,#1a3a52);opacity:.85}
.bosphorus::before{content:"BOĞAZİÇİ";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-90deg);
  font-size:9px;letter-spacing:.2em;color:rgba(200,230,255,.55);white-space:nowrap;font-weight:700}
.bridge{position:absolute;left:42%;width:14%;height:5px;background:#c0c8d4;border-radius:2px;z-index:2;box-shadow:0 2px 0 #6a7380}
.mdist{position:absolute;transform:translate(-50%,-50%);min-width:58px;text-align:center;padding:3px 6px 4px;
  background:rgba(14,20,36,.92);border:1px solid rgba(255,196,0,.25);border-radius:8px;font-size:9px;font-weight:700;
  cursor:pointer;line-height:1.15;z-index:3;white-space:nowrap}
.mdist:active,.mdist.on{border-color:var(--yellow);background:#243250;box-shadow:0 0 0 2px rgba(255,196,0,.25)}
.mdist.owned{border-color:var(--green)}
.mdist .it{font-size:8px;color:var(--muted);font-weight:600}
.map-info{overflow:auto;display:flex;flex-direction:column;gap:8px}
.side-tag{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.car-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center}
.car-thumb{height:58px;display:grid;place-items:center;background:#0c1322;border-radius:10px;overflow:hidden;position:relative}
.lock-note{font-size:11px;color:var(--orange);font-weight:700}
.kv{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:3px}
.driver-ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:var(--navy-3);border:2px solid var(--line);flex-shrink:0}

/* MODAL / TOAST / FX */
#modal{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{width:min(460px,94%);max-height:86%;overflow:auto;background:#141c32;border:1px solid var(--line);
  border-radius:18px;padding:16px;box-shadow:var(--shadow)}
#modal h2{font-size:16px;margin-bottom:8px}
#toast{position:absolute;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 10px);transform:translateX(-50%) translateY(16px);
  background:#1c2744;border:1px solid var(--yellow);color:var(--text);padding:8px 14px;border-radius:999px;
  font-size:12px;font-weight:700;opacity:0;pointer-events:none;z-index:50;transition:.25s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#orient{display:none;position:absolute;inset:0;z-index:80;background:#0a1020;color:var(--yellow);
  align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:800;letter-spacing:.08em;text-align:center;padding:20px}
#orient span{font-size:40px}
@media (orientation:portrait) and (max-width:700px){#orient{display:flex}}
.result-line{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.result-line.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}
.coin-pop{position:absolute;right:120px;top:calc(var(--top) + var(--safe-t) - 4px);z-index:30;font-weight:800;font-size:13px;
  color:var(--green);pointer-events:none;animation:coin 1s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.coin-pop.out{color:var(--red)}
@keyframes coin{from{opacity:1;transform:translateY(8px)}to{opacity:0;transform:translateY(-22px)}}
.chart{width:100%;height:70px;background:#0c1322;border-radius:10px;padding:6px}
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:#0c1322;border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:10px;color:var(--dim)}
.badge.on{border-color:var(--yellow);color:var(--yellow)}
.badge .ic{font-size:20px;display:block;margin-bottom:4px}
@media (min-width:900px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 80px rgba(0,0,0,.5)}}

function carById(id){return CARS.find(c=>c.id===id)}
function distById(id){return DISTRICTS.find(d=>d.id===id)}
function levelInfo(level){return LEVELS.find(l=>l.level===level)||LEVELS[0]}
function xpForLevel(level){const cur=LEVELS.find(l=>l.level===level),next=LEVELS.find(l=>l.level===level+1);return {cur:cur?cur.xp:0,next:next?next.xp:null}}
function hour(m){return (((m%1440)+1440)%1440)/60}
function todFromMinutes(m){const h=hour(m);if(h>=6&&h<8)return"dawn";if(h>=8&&h<17)return"day";if(h>=17&&h<19.5)return"dusk";return"night"}
function isRush(m){const h=hour(m);return (h>=7.5&&h<9.5)||(h>=17&&h<20)}
function eventObj(){return EVENTS.find(e=>e.id===(state&&state.eventId))||EVENTS[5]}
function clockStr(min){const m=((min%1440)+1440)%1440;return pad2(Math.floor(m/60))+":"+pad2(m%60)}
function standCap(st){return 1+(st.level||1)}
function standFee(st){const d=distById(st.id);return Math.round((d?1200+d.prestige*800:1500)*(st.level||1))}
function standUpgradeCost(st){const d=distById(st.id);return Math.round((d?d.standCost:40000)*0.55*st.level)}

function avaSvg(ava, size) {

  else if(st==="beard") extra=`<ellipse cx="${s/2}" cy="${s*0.78}" rx="${s*0.18}" ry="${s*0.14}" fill="${hair}"/>
    <rect x="${s*0.2}" y="${s*0.12}" width="${s*0.6}" height="${s*0.18}" rx="6" fill="${hair}"/>`;
  else if(st==="long") extra=`<path d="M10 28 Q10 6 ${s/2} 6 Q${s-10} 6 ${s-10} 28 L${s-6} 62 L6 62 Z" fill="${hair}"/>`;
  else if(st==="bun") extra=`<circle cx="${s/2}" cy="10" r="8" fill="${hair}"/><rect x="${s*0.2}" y="${s*0.14}" width="${s*0.6}" height="${s*0.16}" rx="6" fill="${hair}"/>`;
  else if(st==="cap") extra=`<rect x="${s*0.18}" y="${s*0.1}" width="${s*0.64}" height="${s*0.2}" rx="4" fill="${ava.cap||"#1a3a6a"}"/><rect x="${s*0.12}" y="${s*0.22}" width="${s*0.4}" height="4" fill="${ava.cap||"#1a3a6a"}"/>`;
  else extra=`<rect x="${s*0.18}" y="${s*0.1}" width="${s*0.64}" height="${s*0.22}" rx="8" fill="${hair}"/>`;
  const glasses = ava.glasses ? `<rect x="${s*0.3}" y="${s*0.4}" width="10" height="7" rx="2" fill="none" stroke="#222" stroke-width="1.4"/>
    <rect x="${s*0.54}" y="${s*0.4}" width="10" height="7" rx="2" fill="none" stroke="#222" stroke-width="1.4"/>

  return {skin,hair,style,shirt,glasses:chance(.28)||type==="business",cap:type==="fan"?"#111":"#1a3a6a",age:type==="elderly"?"old":"adult",bag:type==="tourist"||type==="vip"};

let state=null, view="durak", paused=false, ride=null, tickTimer=null, toastTimer=null;

function demandMul(districtId){
  let d=1;
  const ev=eventObj();
  if(ev){if(!ev.districts||ev.districts.includes(districtId)) d*=ev.demand||1}
  if(state.weekly&&state.weekly.district===districtId) d*=state.weekly.demand||1;
  if(isRush(state.minutes)) d*=1.35;
  const h=hour(state.minutes);
  if(h>=1&&h<6) d*=.35; else if(h>=23||h<1) d*=.55;
  const it=state.itibar[districtId]??60;
  d*=.7+it/200;
  const rival=state.rivals[districtId];
  if(rival) d*=clamp(1-rival.power*0.08,0.55,1);
  const st=getStand(districtId);
  if(st) d*=1+(st.level-1)*0.08;
  return d;
}
function distKm(a,b){
  const A=destById(a),B=destById(b);
  if(!A||!B) return 8;
  let dx=(A.x||50)-(B.x||50), dy=(A.y||50)-(B.y||50);
  let d=Math.sqrt(dx*dx+dy*dy)*0.55;
  if(A.side&&B.side&&A.side!==B.side) d+=6;
  if(A.airport||B.airport) d+=8;
  return clamp(d,3,55);
}
function plateGen(used){
  let p,n=0; do{
    const L=LETTERS[irand(0,LETTERS.length-1)]+LETTERS[irand(0,LETTERS.length-1)]+LETTERS[irand(0,LETTERS.length-1)];
    p="34 "+L+" "+pad2(irand(1,99)); n++;
  }while(used.has(p)&&n<80);
  used.add(p); return p;
}
function paxName(type){
  if(type==="tourist") return pick(TOURIST_NAMES);
  if(type==="celebrity") return pick(CELEB_NAMES);
  return pick(FIRST)+" "+pick(LAST);
}
function makeStand(id,level=1){return {id,level}}
function getStand(id){return (state.stands||[]).find(s=>(s.id||s)===id)}
function ownedStand(id){return !!getStand(id)}
function standIdList(){return state.stands.map(s=>s.id||s)}

function migrate(s){
  if(!s||!s.version) return null;
  if(s.version===1){
    s.version=2;
    s.stands=(s.stands||[]).map(id=>typeof id==="string"?makeStand(id,1):id);
    (s.taxis||[]).forEach(t=>{
      t.km=t.km??Math.round((t.rides||0)*14+rand(2000,18000));
      t.insured=!!t.insured; t.lastServiceKm=t.lastServiceKm??Math.max(0,t.km-2000);
      t.plateOwned=t.plateOwned??true;
    });
    (s.drivers||[]).forEach(d=>{
      d.honesty=d.honesty??irand(2,5); d.fatigue=d.fatigue??0; d.morale=d.morale??70;
      d.traits=d.traits&&d.traits.length?d.traits:[pick(TRAITS).id]; d.trainLvl=d.trainLvl??0;
    });
    s.history=s.history||[]; s.achievements=s.achievements||[]; s.leftItems=s.leftItems||[];
    s.rivals=s.rivals||{}; s.plateMarket=s.plateMarket||[]; s.lastReport=s.lastReport||null;
    s.todayIn=s.todayIn||0; s.todayOut=s.todayOut||0;
    if(!s.stats) s.stats={rides:0,earned:0,tips:0,days:1};
    s.stats.airports=s.stats.airports||0; s.stats.nights=s.stats.nights||0; s.stats.fiveStars=s.stats.fiveStars||0;
    DISTRICTS.forEach(d=>{if(!s.rivals[d.id]&&chance(.6)) s.rivals[d.id]={name:pick(RIVAL_NAMES),power:irand(1,3)}});
  }
  if(!Array.isArray(s.stands)) s.stands=[];
  s.stands=s.stands.map(x=>typeof x==="string"?makeStand(x,1):x);
  s.history=s.history||[]; s.achievements=s.achievements||[]; s.leftItems=s.leftItems||[];
  s.rivals=s.rivals||{}; s.todayIn=s.todayIn||0; s.todayOut=s.todayOut||0;
  return s;
}

function soundEnabled(){return state&&state.sound}
function beep(freq,dur,type="sine",vol=0.05){
  if(!soundEnabled()) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

  if(kind==="ok"){beep(660,.1,"sine",.05);setTimeout(()=>beep(880,.14,"sine",.05),90)}
  if(kind==="bad") beep(180,.2,"sawtooth",.04);
  if(kind==="tap") beep(920,.06,"square",.04);
  if(kind==="horn"){beep(420,.12,"square",.04);setTimeout(()=>beep(420,.18,"square",.04),160)}
  if(kind==="achieve"){beep(784,.1,"sine",.05);setTimeout(()=>beep(988,.18,"sine",.05),120)}
}

function computeWaiting(){
  const d=state.currentStand, dens=distById(d)?.density||2;

  waitingCount=clamp(Math.round(n),0,14); return waitingCount;
}

function playerTaxi(){

function checkQuests(){
  let n=0;
  while(state.questIndex<QUESTS.length){
    const q=QUESTS[state.questIndex];
    if(!q.check(state)) break;
    state.questDone.push(q.id); addXp(q.xp); addCash(q.cash);
    state.questIndex++; toast("Görev tamam: "+q.title+"  +"+tl(q.cash)); n++;
  }

function checkDaily(kind,amount,dest){
  state.daily.forEach(t=>{
    if(t.have>=t.need) return;
    if(t.id==="d_rides"&&kind==="ride") t.have+=1;
    if(t.id==="d_earn"&&kind==="earn") t.have=clamp(t.have+amount,0,t.need);
    if(t.id==="d_dest"&&kind==="dest"&&dest===t.dest) t.have=1;
    if(t.have>=t.need&&!t.paid){
      t.paid=true; addXp(t.xp); addCash(t.cash); toast("Günlük görev: +"+tl(t.cash)); sfx("cash");
    }

}

function traitOf(d,id){return d.traits&&d.traits.includes(id)}
function passiveForTaxi(t){
  const car=carById(t.modelId), drv=driverById(t.driverId);
  if(!drv) return {gain:0,fuel:0,note:""};
  const d=distById(t.standId), ev=eventObj(), it=state.itibar[t.standId]??60;
  let earn=1600+(car.comfort||2)*380+drv.skill*520;
  earn*=(d?.density||2)/3; earn*=.7+it/200; earn*=ev.demand||1;
  if(state.weekly&&state.weekly.district===t.standId) earn*=state.weekly.demand||1;
  earn*=(.5+t.condition/200);
  if(drv.fatigue>70) earn*=.7; else if(drv.fatigue>40) earn*=.85;
  earn*=.7+drv.morale/250;
  if(traitOf(drv,"hasty")) earn*=1.12;
  if(traitOf(drv,"funny")) earn*=1.06;
  if(traitOf(drv,"night")&&(hour(state.minutes)<7||hour(state.minutes)>21)) earn*=1.1;
  const st=getStand(t.standId);
  const atStand=taxisAt(t.standId).length;
  if(st&&atStand>standCap(st)) earn*=0.65;
  earn*=.85+Math.random()*.3;
  if(traitOf(drv,"sly")||drv.honesty<=2){const steal=earn*(0.08*(5-drv.honesty)/4); earn-=steal}
  let fuelUse=rand(16,30)*(car.fuel==="Dizel"?1.1:1)*(state.upgrades.yakitkart?0.7:1);
  if(traitOf(drv,"saver")) fuelUse*=.8;
  return {gain:Math.round(earn),fuel:fuelUse};
}

function rollDriverWorld(report){
  const logs=report||[];
  state.taxis.forEach(t=>{
    if(!t.driverId) return;
    const drv=driverById(t.driverId); if(!drv) return;
    // fatigue / morale
    drv.fatigue=clamp(drv.fatigue+irand(8,18),0,100);
    drv.morale=clamp(drv.morale+irand(-6,5)+(t.condition<40?-6:0),0,100);
    // breakdown
    const since=t.km-(t.lastServiceKm||0);
    const risk=clamp((100-t.condition)/400 + since/80000 + (drv.fatigue>80?0.08:0) + (traitOf(drv,"hasty")?0.04:0) - (traitOf(drv,"careful")?0.04:0),0,.35);
    if(chance(risk)){
      const dmg=irand(2500,9000);
      const pay=t.insured?Math.round(dmg*0.25):dmg;
      const cam=state.upgrades.kamera?0.7:1;
      const cost=Math.round(pay*cam);
      t.condition=clamp(t.condition-irand(8,20),5,100);
      addCash(-cost);
      logs.push("⚠️ "+t.plate+" kaza/arıza  -"+tl(cost)+(t.insured?" (sigorta)":""));
      if(traitOf(drv,"rude")||chance(.3)) drv.morale-=8;
    }
    // complaint
    if((traitOf(drv,"rude")&&chance(.15))||chance(.04)){
      const fine=Math.round(800*(state.upgrades.kamera?0.7:1));
      addCash(-fine); state.itibar[t.standId]=clamp((state.itibar[t.standId]??60)-3,20,99);
      logs.push("😠 Şikayet: "+drv.name+"  -"+tl(fine));
      drv.morale-=5;
    }
    // raise
    if(drv.morale<45&&chance(.35)||(drv.morale<25&&chance(.6))){
      const want=Math.round(drv.salary*0.12);
      drv._raise=want;
    }
    // quit
    if(drv.morale<18&&chance(.5)||drv.fatigue>95&&chance(.2)){
      logs.push("👋 "+drv.name+" işten ayrıldı.");
      t.driverId=null;
      state.drivers=state.drivers.filter(x=>x.id!==drv.id);
    }
  });
  return logs;
}

function applyDayEnd(){
  const report=[]; let total=0;
  state.taxis.forEach(t=>{
    if(!t.driverId) return;
    const r=passiveForTaxi(t);
    t.earnings+=r.gain; t.rides+=irand(6,14);
    t.km+=irand(80,180);
    t.condition=clamp(t.condition-rand(1.2,3.2)*(carById(t.modelId).wear||1),5,100);
    t.fuel=clamp(t.fuel-r.fuel,0,100);
    addCash(r.gain); total+=r.gain;
    const drv=driverById(t.driverId);
    report.push((drv?drv.name:"Şoför")+" / "+t.plate+"  +"+tl(r.gain));
  });
  // rest unassigned drivers slightly
  state.drivers.forEach(d=>{if(!d.taxiId){d.fatigue=clamp(d.fatigue-18,0,100);d.morale=clamp(d.morale+3,0,100)}});
  if(state.upgrades.reklam){addCash(600);total+=600;report.push("Reklam panosu  +600 TL")}
  const more=rollDriverWorld(report);
  checkDaily("earn",total);
  const dayRec={day:state.day,income:state.todayIn,expense:state.todayOut,rides:state.stats.rides};
  state.history=(state.history||[]).concat([dayRec]).slice(-7);
  state.lastReport={total,report:more,income:state.todayIn,expense:state.todayOut};
  return {total,report:more,income:state.todayIn,expense:state.todayOut};
}

function monthEnd(){
  let rent=0,salary=0,interest=0,bankInt=0,standFees=0,insure=0;
  state.taxis.forEach(t=>{
    if(!t.owned) rent+=t.rent||carById(t.modelId).rent;
    if(t.insured){const fee=Math.round((carById(t.modelId).price)*0.008);insure+=fee}
  });
  state.drivers.forEach(d=>{if(d.hired) salary+=d.salary});
  state.stands.forEach(st=>standFees+=standFee(st));
  if(state.loan>0){interest=Math.round(state.loan*0.06);state.loan+=interest}
  if(state.bank>0){bankInt=Math.round(state.bank*0.03);state.bank+=bankInt}
  const out=rent+salary+interest+standFees+insure;
  addCash(-out);
  return {rent,salary,interest,bankInt,standFees,insure,out};
}

function newDay(fromSleep){
  const dayRep=applyDayEnd();
  state.todayIn=0; state.todayOut=0;
  state.day++; state.stats.days=state.day;
  let monthReport=null;
  if((state.day-1)%30===0&&state.day>1){
    state.month++; if(state.month>12){state.month=1;state.year++}
    monthReport=monthEnd();
  }
  if(state.day>=state.eventUntil) rollEvent();
  maybeWeekly(); makeDaily();
  if(state.day%5===0) refreshMarketDrivers();
  if(state.day%3===0) refreshPlates();
  // raise prompts stored on drivers
  checkQuests(); save();
  return {dayRep,monthReport};
}

function tick(){

  state.minutes+=MINUTES_PER_TICK;

  state.minutes=7*60+30;

  if(rep.monthReport) openMonthModal(rep.monthReport,rep.dayRep);
  else openDayModal(rep.dayRep);
  const asking=state.drivers.find(d=>d._raise);

  state._pendingRaise=asking||null;
}

function pickPaxType(){
  const ids=Object.keys(PAX_TYPES);
  const weights=ids.map(id=>{
    const t=PAX_TYPES[id];
    let w=typeof t.weight==="function"?t.weight(state): (t.weight||1);
    return Math.max(0,w);
  });
  const sum=weights.reduce((a,b)=>a+b,0)||1;
  let r=Math.random()*sum;
  for(let i=0;i<ids.length;i++){r-=weights[i]; if(r<=0) return PAX_TYPES[ids[i]]}
  return PAX_TYPES.regular;
}

/* ===== RIDE ===== */
function startRide(forceType){
  const taxi=playerTaxi();
  if(!taxi){toast("Bu durakta sürülebilir taksi yok (yakıt / durum / konum).");sfx("bad");return}
  if(waitingCount<=0&&!forceType){toast("Şu an bekleyen yolcu yok.");return}
  const type=forceType||pickPaxType();
  const from=state.currentStand;
  let dest=pick(DISTRICTS.filter(d=>d.id!==from)).id;
  const ev=eventObj();
  if(type.hospital){const hs=DISTRICTS.filter(d=>d.hospital&&d.id!==from); if(hs.length) dest=pick(hs).id}
  if(type.airport||type.id==="vip"){dest=chance(.55)?"ist":"saw"}
  if(type.id==="fan"&&ev.districts){const opts=ev.districts.filter(id=>id!==from); if(opts.length) dest=pick(opts)}
  if(ev.districts&&Math.random()<.3&&!type.airport&&!type.hospital){const opts=ev.districts.filter(id=>id!==from); if(opts.length) dest=pick(opts)}
  const km=distKm(from,dest);
  const line=pick(type.lines);
  ride={
    taxiId:taxi.id, type,
    pax:{name:paxName(type.id),ava:makeAva(type.id)},
    from,dest,km, phase:"greet", line, greet:null, midAns:null,
    mid:pick(MID_GENERIC), taps:[], tap:null, event:null, eventDone:false,
    progress:0, fare:0, tip:0, rating:5, mood:type.mood||60,
    last:performance.now(),
    driveMs:clamp(7000+km*240,8000,16000)*(state.upgrades.gps?0.85:1)*(ev.slow||1),
    scheduled:[], flags:{}
  };
  const nTaps=km>16?3:2;
  for(let i=0;i<nTaps;i++) ride.scheduled.push({at:(i+1)/(nTaps+1)+rand(-0.04,0.04),ev:pick(TAP_EV)});
  ride.eventAt=0.55+rand(-0.1,0.12);
  waitingCount=Math.max(0,waitingCount-1);
  paused=true; sfx("click"); $("#toast").classList.remove("show"); renderRide();
}

      <div class="result-line"><span>Ücret</span><span>${tl(ride.fare)}</span></div>
      <div class="result-line"><span>Bahşiş</span><span class="money">${tl(ride.tip)}</span></div>
      <div class="result-line total"><span>Toplam</span><span class="money">${tl(ride.fare+ride.tip)}</span></div>

  el.innerHTML=`

        <div class="pax-seat">
          <div class="pax-ava">${avaSvg(ride.pax.ava,48)}</div>

function moodLabel(m){if(m>=80)return"😊";if(m>=60)return"🙂";if(m>=40)return"😐";if(m>=25)return"🙁";return"😠"}

function applyChoice(ch){
  if(!ch) return;
  if(ch.mood) ride.mood=clamp(ride.mood+ch.mood,0,100);
  if(ch.tip) ride.flags.tipMul=(ride.flags.tipMul||1)*(ch.tip);
  if(ch.fare) ride.flags.fareMul=(ride.flags.fareMul||1)*ch.fare;
  if(ch.it) ride.flags.it=(ride.flags.it||0)+ch.it;
  if(ch.fast) ride.flags.fast=true;
  if(ch.slow) ride.flags.slow=true;
  if(ch.dest) {ride.dest=ch.dest; ride.km=distKm(ride.from,ride.dest)}
  if(ch.destAir){if(!destById(ride.dest).airport) ride.dest=chance(.55)?"ist":"saw"; ride.km=distKm(ride.from,ride.dest)}
  if(ch.cost){addCash(-ch.cost); toast("-"+tl(ch.cost))}
  if(ch.delay) ride.driveMs+=ch.delay*1400;
  if(ch.risk) ride.flags.risk=true;
  if(ch.kind==="radar"&&chance(.45)){const fine=irand(600,1800); addCash(-fine); toast("Radar cezası "+tl(fine)); sfx("bad")}
  if(ch.kind==="trust") ride.flags.trust=true;
  if(ch.kick){ride.flags.kick=true}
}
function chooseGreet(i){
  const ch=ride.line.c[+i]; ride.greet=ch; applyChoice(ch);
  if(ch&&ch.kick){toast("Yolcu inmedi. Başka müşteri bekle."); closeRide(); return}
  toast(ride.pax.name+": “"+destById(ride.dest).name+", lütfen.”");
  ride.phase="drive"; ride.last=performance.now(); ride.midAt=0.38+rand(-0.05,0.08); ride.midShown=false;
  sfx("click"); renderRide();
}
let driveRaf=0, tapRaf=0;
function startDriveLoop(){
  cancelAnimationFrame(driveRaf);
  const loop=(now)=>{
    if(!ride||ride.phase!=="drive") return;
    const dt=now-ride.last; ride.last=now;
    let speed=1/ride.driveMs;
    if(ride.flags.fast) speed*=1.15;
    if(ride.flags.slow) speed*=0.82;
    ride.progress=clamp(ride.progress+dt*speed,0,1);
    const ev=eventObj();
    const night=todFromMinutes(state.minutes)==="night"?1.15:1;
    const car=carById(taxiById(ride.taxiId).modelId);
    let fare=(85+ride.km*18)*(ev.fare||1)*night*(.95+car.comfort*.03)*(ride.type.fare||1)*(ride.flags.fareMul||1);
    if(state.upgrades.taksimetre) fare*=1.1;
    ride.fare=Math.round(fare*Math.max(ride.progress,.15));
    const bar=$("#ride-bar"); if(bar) bar.style.width=(ride.progress*100)+"%";
    const meter=$("#ride-meter"); if(meter) meter.textContent=tl(ride.fare);
    if(!ride.midShown&&ride.progress>=ride.midAt){ride.midShown=true;ride.phase="mid";$("#toast").classList.remove("show");renderRide();return}
    if(!ride.eventDone&&ride.progress>=ride.eventAt){
      ride.eventDone=true;
      if(chance(0.62)||ride._forceEvent){
        let pool=RIDE_EVENTS.slice();
        if(eventObj().rain) pool=pool.concat([RIDE_EVENTS.find(e=>e.id==="rain")]);
        ride.event=ride._forceEvent||pick(pool);
        ride.phase="event"; $("#toast").classList.remove("show"); renderRide(); return;
      }
    }
    const nxt=ride.scheduled.find(s=>!s.done&&ride.progress>=s.at);
    if(nxt){nxt.done=true;beginTap(nxt.ev);return}
    if(ride.progress>=1){finishRide();return}
    driveRaf=requestAnimationFrame(loop);
  };
  driveRaf=requestAnimationFrame(loop);
}
function chooseMid(id){
  ride.midAns=id; ride.mood+=id==="good"?8:-6; ride.mood=clamp(ride.mood,0,100);
  ride.phase="drive"; ride.last=performance.now(); sfx("click"); renderRide();
}
function chooseRideEv(i){
  const ch=ride.event.c[+i]; applyChoice(ch);
  ride.phase="drive"; ride.last=performance.now(); sfx("click"); renderRide();
}
function beginTap(ev){
  ride.phase="tap";
  const zoneW=state.upgrades.gps?22:16;
  const zone0=irand(30,70-zoneW);
  ride.tap={ev,zone0,zoneW,pos:0,dir:1,speed:.09+Math.random()*.04,start:performance.now()};
  sfx("tap"); renderRide();
}
function startTapAnim(){
  cancelAnimationFrame(tapRaf);
  const loop=(now)=>{
    if(!ride||ride.phase!=="tap"||!ride.tap) return;
    const t=ride.tap; t.pos+=t.speed*t.dir*1.6;
    if(t.pos>=100){t.pos=100;t.dir=-1} if(t.pos<=0){t.pos=0;t.dir=1}
    const n=$("#tap-needle"); if(n) n.style.left=t.pos+"%";
    if(now-t.start>4000){resolveTap(false);return}
    tapRaf=requestAnimationFrame(loop);
  };
  tapRaf=requestAnimationFrame(loop);
}
function resolveTap(){
  if(!ride||ride.phase!=="tap"||!ride.tap) return;
  const t=ride.tap, hit=t.pos>=t.zone0&&t.pos<=t.zone0+t.zoneW;
  ride.taps.push(!!hit);
  if(hit){sfx("ok");toast("Güzel refleks!");ride.mood=clamp(ride.mood+4,0,100)}
  else{sfx("bad");toast("Kaçırdın…");ride.mood=clamp(ride.mood-8,0,100)}
  ride.tap=null; ride.phase="drive"; ride.last=performance.now(); renderRide();
}

function finishRide(){
  cancelAnimationFrame(driveRaf); cancelAnimationFrame(tapRaf);
  const taxi=taxiById(ride.taxiId), car=carById(taxi.modelId), ev=eventObj();
  const night=todFromMinutes(state.minutes)==="night"?1.15:1;
  let fare=(85+ride.km*18)*(ev.fare||1)*night*(.95+car.comfort*.03)*(ride.type.fare||1)*(ride.flags.fareMul||1);
  if(state.upgrades.taksimetre) fare*=1.1;
  ride.fare=Math.round(fare);
  if(ride.flags.trust){ /* maybe pay later */ if(chance(.7)){toast("Yolcu sonra ödeyecek… dürüstlük puanı."); ride.fare=Math.round(ride.fare*0.2)} else {toast("Güvenin boşa çıkmadı, hepsini bıraktı.")} }

  let tipMul=(ride.flags.tipMul||1)*(ride.type.tip||1);
  if(ride.midAns==="good") tipMul+=.15; if(ride.midAns==="bad") tipMul-=.12;
  const hits=ride.taps.filter(Boolean).length, miss=ride.taps.length-hits;
  tipMul+=hits*.1-miss*.12+(car.comfort-2)*.06;
  if(state.upgrades.koltuk) tipMul*=1.15;
  if(ev.tip) tipMul*=ev.tip;
  if(ride.flags.fast&&ride.type.hurry) tipMul*=1.2;
  if(ride.flags.slow&&ride.type.careful) tipMul*=1.2;
  if(ride.flags.fast&&ride.type.careful) tipMul*=.8;
  if(ride.flags.slow&&ride.type.hurry) tipMul*=.7;
  tipMul*=0.7+ride.mood/200;
  tipMul=clamp(tipMul,0,2.4);
  ride.tip=Math.round(ride.fare*0.12*tipMul);

  let rating=3.4+(ride.mood-50)/28+(ride.flags.it||0)*0.3+hits*.3-miss*.55+(taxi.condition-70)/90;
  if(ride.type.strict) rating-=0.4;
  if(state.upgrades.klima) rating+=0.2;
  rating=clamp(Math.round(rating),1,5);
  ride.rating=rating;

  const gain=ride.fare+ride.tip;
  addCash(gain); state.stats.tips+=ride.tip; state.stats.rides+=1;
  if(rating>=5){state.stats.fiveStars++; grantAch("five_star")}
  if(destById(ride.dest).airport){state.stats.airports++; grantAch("airport")}
  const h=hour(state.minutes); if(h<5||h>=0&&h<5){state.stats.nights++; grantAch("night_owl")}
  if(state.stats.rides===1) grantAch("first_ride");

  taxi.rides+=1; taxi.earnings+=gain; taxi.km+=Math.round(ride.km);
  const wear=(1.4+ride.km*.12+miss*.8)*(car.wear||1)*(ride.flags.risk?1.4:1);
  taxi.condition=clamp(taxi.condition-wear,4,100);
  const fuelUse=(4+ride.km*.35)*(car.fuel==="Dizel"?1.1:1)*(state.upgrades.yakitkart?0.7:1);
  taxi.fuel=clamp(taxi.fuel-fuelUse,0,100);
  if(ride.flags.risk&&chance(.2)&&!taxi.insured){
    const dmg=irand(400,2000); addCash(-dmg); toast("Küçük hasar: -"+tl(dmg));
  }

  let minutesPass=Math.round(8+ride.km*1.1*(ev.slow||1)*(state.upgrades.gps?0.85:1)*(ride.flags.fast?0.85:1)*(ride.flags.slow?1.2:1));
  state.minutes+=minutesPass;
  if(state.minutes>=1440){state.minutes-=1440;newDay(false)}

  const from=ride.from, dest=ride.dest;
  const delta=(rating-3)*1.4+(ride.flags.it||0);
  if(state.itibar[from]!=null) state.itibar[from]=clamp(state.itibar[from]+delta*.4,20,99);
  if(state.itibar[dest]!=null) state.itibar[dest]=clamp(state.itibar[dest]+delta,20,99);

  addXp(8+Math.round(ride.km/4)+(rating>=5?4:0)+(ride.type.id==="vip"?6:0));
  checkDaily("ride"); checkDaily("earn",gain); checkDaily("dest",1,dest);
  checkQuests(); save(); sfx("cash");
  ride.phase="result"; renderRide();
  // leftover item chance
  if(chance(.16)&&ride.type.id!=="drunk"){
    ride.leftItem={name:pick(["telefon","cüzdan","kulaklık","anahtar","şemsiye"]),pax:ride.pax.name};
  }
}
function closeRide(){
  const left=ride&&ride.leftItem;
  ride=null; paused=false;
  $("#ride").classList.add("hidden"); $("#ride").innerHTML="";
  computeWaiting();
  if(left){
    openModal(`<h2>Unutulan eşya</h2>
      <p class="muted">${esc(left.pax)} bir ${esc(left.name)} unuttu. Ne yaparsın?</p>
      <div class="col" style="margin-top:10px">
        <button class="btn btn-y btn-block" data-act="item-return" data-name="${esc(left.name)}">Teslim et (itibar + ödül)</button>
        <button class="btn btn-d btn-block" data-act="item-keep">Sakla (nakit, itibar düşer)</button>
      </div>`);
    state._left=left;
  }
  renderAll();
}
function needStandFirst(){if(!state.stands.length){toast("Önce bir durak kurmalısın.");return true}return false}
function buyCar(modelId,kind){
  if(needStandFirst()) return;
  const car=carById(modelId); if(!car) return;
  if(state.level<car.level){toast("Seviye "+car.level+" gerekli.");return}
  let price=0,owned=true,cond=100,rent=0;
  if(kind==="yeni"){price=car.price;cond=100;owned=true}
  else if(kind==="used"){price=car.used;cond=irand(55,82);owned=true}
  else{price=0;cond=irand(86,96);owned=false;rent=car.rent}
  if(owned&&state.cash<price){toast("Yeterli bakiyen yok.");sfx("bad");return}
  if(!owned&&state.cash<car.rent){toast("İlk ay kirasını karşılayacak bakiyen yok.");sfx("bad");return}
  if(owned) addCash(-price);
  const used=new Set(state.taxis.map(t=>t.plate));
  const t={id:uid("tx"),modelId,plate:plateGen(used),owned,condition:cond,fuel:owned&&kind==="yeni"?100:irand(50,90),
    driverId:null,standId:state.currentStand,rides:0,earnings:0,buyPrice:owned?price:0,rent,
    km:kind==="yeni"?0:irand(30000,140000),insured:false,lastServiceKm:0,plateOwned:false};
  state.taxis.push(t);
  if(!state.activeTaxiId) state.activeTaxiId=t.id;
  checkQuests(); save(); sfx("cash");
  toast(car.name+(owned?" filoya katıldı. Plaka ayrıca alınır.":" kiralandı. Aylık "+tl(rent)));
  renderAll();
}
function sellTaxi(id){
  const t=taxiById(id); if(!t) return;
  if(!t.owned){
    state.taxis=state.taxis.filter(x=>x.id!==id);
    if(t.driverId){const d=driverById(t.driverId); if(d) d.taxiId=null}
    if(state.activeTaxiId===id) state.activeTaxiId=state.taxis[0]?.id||null;
    toast(t.plate+" iade edildi."); save(); renderAll(); return;
  }
  const val=Math.round(t.buyPrice*0.7)+(t.plateOwned?4000:0);
  openModal(`<h2>Taksiyi sat</h2>
    <p class="muted">${esc(carById(t.modelId).name)} · ${esc(t.plate)} alış bedelinin %70'i${t.plateOwned?" + plaka":""} ile satılır.</p>
    <p style="margin:10px 0;font-size:18px;font-weight:800" class="money">${tl(val)}</p>
    <div class="row"><button class="btn btn-g btn-block" data-act="close-modal">Vazgeç</button>
    <button class="btn btn-d btn-block" data-act="confirm-sell" data-id="${t.id}">Sat</button></div>`);
}
function confirmSell(id){
  const t=taxiById(id); if(!t||!t.owned) return;
  if(state.taxis.length<=1){toast("Son taksini satamazsın.");closeModal();return}
  const val=Math.round(t.buyPrice*0.7)+(t.plateOwned?4000:0);
  addCash(val);
  if(t.driverId){const d=driverById(t.driverId); if(d) d.taxiId=null}
  state.taxis=state.taxis.filter(x=>x.id!==id);
  if(state.activeTaxiId===id) state.activeTaxiId=state.taxis[0]?.id||null;
  closeModal(); sfx("cash"); toast(t.plate+" "+tl(val)+" karşılığı satıldı."); save(); renderAll();
}
function takeWheel(id){
  const t=taxiById(id); if(!t) return;

  if(t.standId!==state.currentStand){
    const km=distKm(state.currentStand,t.standId);

    toast(distById(t.standId).name+" durağına geçtin. Direksiyon sende.");
  } else toast("Direksiyon sende: "+t.plate);
  sfx("click"); save(); renderAll();
}
function hireDriver(mid){
  const m=state.marketDrivers.find(d=>d.id===mid); if(!m) return;
  if(state.cash<m.salary*0.25){toast("İlk maaş avansı için bakiye yetersiz.");return}
  const d={id:uid("dr"),name:m.name,skill:m.skill,salary:m.salary,hired:true,taxiId:null,
    honesty:m.honesty||irand(2,5),fatigue:0,morale:70,traits:m.traits||[pick(TRAITS).id],trainLvl:0};

function fireDriver(id){

function assignDriver(driverId,taxiId){
  const d=driverById(driverId); if(!d) return;
  if(d.taxiId){const old=taxiById(d.taxiId); if(old) old.driverId=null}
  if(taxiId){
    const t=taxiById(taxiId); if(!t) return;
    if(t.driverId&&t.driverId!==d.id){const o=driverById(t.driverId); if(o) o.taxiId=null}
    t.driverId=d.id; d.taxiId=t.id;
  } else d.taxiId=null;
  checkQuests(); save(); sfx("click"); renderAll();
}
function trainDriver(id){

function restDriver(id){

function acceptRaise(id,yes){
  const d=driverById(id); closeModal(); if(!d||!d._raise) return;
  if(yes){d.salary+=d._raise; d.morale=clamp(d.morale+20,0,100); toast(d.name+" zam aldı: "+tl(d.salary));}
  else {d.morale=clamp(d.morale-25,0,100); toast(d.name+" zam alamadı, morali bozuldu.")}
  d._raise=0; save(); renderAll();
}
function buyStand(id){
  const d=distById(id); if(!d) return;
  if(ownedStand(id)){toast("Bu durak zaten senin.");return}
  if(state.level<d.level){toast("Seviye "+d.level+" gerekli.");return}
  if(state.cash<d.standCost){toast("Yeterli bakiyen yok.");sfx("bad");return}
  addCash(-d.standCost); state.stands.push(makeStand(id,1));
  checkQuests(); save(); sfx("cash"); toast(d.name+" durağını kurdun."); renderAll();
}
function upgradeStand(id){
  const st=getStand(id); if(!st) return;
  if(st.level>=3){toast("Durak en üst seviyede.");return}
  const cost=standUpgradeCost(st);
  if(state.cash<cost){toast("Yükseltme için bakiye yetersiz.");return}
  addCash(-cost); st.level++; grantAch("upgrade_stand");
  toast(distById(id).name+" durağı seviye "+st.level+" · kapasite "+standCap(st));
  sfx("ok"); save(); renderAll();
}
function goStand(id){
  if(!ownedStand(id)){toast("Bu durak senin değil.");return}
  if(state.currentStand===id){toast("Zaten buradasın.");return}
  const km=distKm(state.currentStand,id);
  state.minutes+=Math.round(12+km*1.3);
  if(state.minutes>=1440){state.minutes-=1440;newDay(false)}
  state.currentStand=id; selectedDistrict=id;
  const t=activeTaxi(); if(t&&!t.driverId) t.standId=id;
  computeWaiting(); save(); toast(distById(id).name+" durağına geçtin."); view="durak"; renderAll();
}
function repairCost(t){const miss=100-t.condition,car=carById(t.modelId);let c=miss*(90+car.comfort*25);if(state.upgrades.atolye)c*=.75;return Math.round(c)}
function fuelCost(t){const miss=100-t.fuel,car=carById(t.modelId);const per=car.fuel==="Dizel"?28:18;let c=miss*per;if(state.upgrades.yakitkart)c*=.7;return Math.round(c)}
function serviceCost(t){return Math.round(1800+carById(t.modelId).comfort*400+(t.km-(t.lastServiceKm||0))/40)}
function insureCost(t){return Math.round(carById(t.modelId).price*0.008)}
function doRepair(id){const t=taxiById(id);if(!t)return;const c=repairCost(t);if(c<=0){toast("Araç zaten sapasağlam.");return}if(state.cash<c){toast("Tamir için bakiye yetersiz.");return}addCash(-c);t.condition=100;save();sfx("ok");toast(t.plate+" tamir edildi. "+tl(c));renderAll()}
function doFuel(id){const t=taxiById(id);if(!t)return;const c=fuelCost(t);if(c<=0){toast("Depo zaten dolu.");return}if(state.cash<c){toast("Yakıt için bakiye yetersiz.");return}addCash(-c);t.fuel=100;save();sfx("ok");toast(t.plate+" yakıt doldu. "+tl(c));renderAll()}
function doService(id){const t=taxiById(id);if(!t)return;const c=serviceCost(t);if(state.cash<c){toast("Bakım için bakiye yetersiz.");return}addCash(-c);t.lastServiceKm=t.km;t.condition=clamp(t.condition+8,0,100);toast(t.plate+" periyodik bakımdan geçti.");sfx("ok");save();renderAll()}
function toggleInsure(id){
  const t=taxiById(id); if(!t) return;
  if(t.insured){t.insured=false;toast("Sigorta iptal.");}
  else {const c=insureCost(t); if(state.cash<c){toast("İlk prim için bakiye yok.");return} addCash(-c); t.insured=true; grantAch("insure"); toast("Sigorta başladı. Aylık "+tl(c))}
  save(); renderAll();
}
function buyPlate(pid, taxiId){
  const pl=state.plateMarket.find(p=>p.id===pid); if(!pl) return;
  const t=taxiById(taxiId||state.activeTaxiId||state.taxis[0]?.id); if(!t) return;
  if(state.cash<pl.price){toast("Plaka için bakiye yetersiz.");return}
  addCash(-pl.price); t.plate=pl.plate; t.plateOwned=true;
  state.plateMarket=state.plateMarket.filter(p=>p.id!==pid);
  toast(t.plate+" plakası bağlandı."); sfx("cash"); save(); renderAll();
}
function bankDeposit(n){n=Math.round(n);if(n<=0)return;if(state.cash<n){toast("Nakit yetersiz.");return}addCash(-n,"xfer");state.bank+=n;checkQuests();save();sfx("cash");toast(tl(n)+" yatırıldı.");renderAll()}
function bankWithdraw(n){n=Math.round(n);if(n<=0)return;if(state.bank<n){toast("Hesapta yeterli bakiye yok.");return}state.bank-=n;addCash(n,"xfer");save();sfx("cash");toast(tl(n)+" çekildi.");renderAll()}
function maxLoan(){return state.level*50000}
function takeLoan(n){n=Math.round(n);if(n<=0)return;if(state.loan+n>maxLoan()){toast("Kredi limitin "+tl(maxLoan())+".");return}state.loan+=n;addCash(n,"xfer");save();sfx("cash");toast(tl(n)+" kredi çekildi. Aylık faiz %6.");renderAll()}
function repayLoan(n){n=Math.round(Math.min(n,state.loan));if(n<=0)return;if(state.cash<n){toast("Nakit yetersiz.");return}addCash(-n,"xfer");state.loan-=n;save();sfx("ok");toast(tl(n)+" kredi ödemesi yapıldı.");renderAll()}
function buyUpgrade(id){const u=SHOP.find(s=>s.id===id);if(!u)return;if(state.upgrades[id]){toast("Zaten satın alındı.");return}if(state.cash<u.price){toast("Yeterli bakiyen yok.");return}addCash(-u.price);state.upgrades[id]=1;save();sfx("cash");toast(u.name+" alındı.");renderAll()}
function itemReturn(){closeModal();if(!state._left)return;addCash(irand(400,1200));const d=state.currentStand;state.itibar[d]=clamp((state.itibar[d]??60)+4,20,99);grantAch("return_item");toast("Eşya teslim edildi, itibar arttı.");state._left=null;save();renderAll()}
function itemKeep(){closeModal();if(!state._left)return;addCash(irand(200,900));const d=state.currentStand;state.itibar[d]=clamp((state.itibar[d]??60)-6,20,99);toast("Eşyayı sakladın… itibar zedelendi.");state._left=null;save();renderAll()}

function chartSvg(hist){
  const vals=(hist||[]).map(h=>h.income||0);
  if(!vals.length) return `<div class="dim">Henüz 7 günlük veri yok. Günleri tamamla.</div>`;
  const w=320,h=70,max=Math.max(...vals,1);
  const pts=vals.map((v,i)=>{
    const x=10+i*((w-20)/Math.max(vals.length-1,1));
    const y=h-10-(v/max)*(h-20);
    return x+","+y;
  }).join(" ");
  const slot=(w-24)/Math.max(vals.length,1);
  const bw=Math.min(26,Math.max(8,slot-8));
  const bars=vals.map((v,i)=>{
    const x=12+i*slot+(slot-bw)/2;
    const bh=(v/max)*(h-22);
    return `<rect x="${x}" y="${h-10-bh}" width="${bw}" height="${bh}" rx="2" fill="#ffc400" opacity=".85"/>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" height="70">${bars}
    <polyline points="${pts}" fill="none" stroke="#3ddc84" stroke-width="2"/></svg>`;
}

        <div style="margin-top:4px;font-weight:800" class="${tab==="rent"?"money out":"money"}">${tab==="rent"?tl(price)+"/ay":tl(price)}</div>
      </div>
      <div class="col">${locked?`<div class="lock-note">🔒 Sv.${car.level}</div>`:
        `<button class="btn btn-y btn-sm" data-act="buy-car" data-id="${car.id}" data-kind="${tab}">${lbl}</button>`}</div>
    </div>`;
  }).join("");
  return `<div class="view-pad">${tabs}
    <p class="dim" style="margin-bottom:8px">Satın alınan araçlar %70’ine satılır. Plaka ayrıca alınır. Önce durak şart.</p>
    <div class="list">${rows}</div></div>`;
}

function renderHarita(){
  const sel=distById(selectedDistrict)||distById(state.currentStand);
  const marks=DISTRICTS.map(d=>{
    const owned=ownedStand(d.id), on=selectedDistrict===d.id, it=Math.round(state.itibar[d.id]||0);
    return `<button class="mdist ${owned?"owned":""} ${on?"on":""}" style="left:${d.x}%;top:${d.y}%" data-act="sel-dist" data-id="${d.id}">
      ${esc(d.name)}<div class="it">itibar %${it}</div></button>`;
  }).join("");
  const owned=ownedStand(sel.id), locked=state.level<sel.level, st=getStand(sel.id);
  const evHere=(eventObj().districts||[]).includes(sel.id);
  const weekHere=state.weekly&&state.weekly.district===sel.id;
  const rival=state.rivals[sel.id];
  let actions="";
  if(owned){
    actions=(state.currentStand===sel.id?`<button class="btn btn-ok btn-block" disabled>Şu an buradasın</button>`:
      `<button class="btn btn-y btn-block" data-act="go-stand" data-id="${sel.id}">Durağıma geç</button>`);
    if(st&&st.level<3) actions+=`<button class="btn btn-g btn-block" style="margin-top:6px" data-act="up-stand" data-id="${sel.id}">Durağı yükselt (Sv.${st.level+1}) · ${tl(standUpgradeCost(st))}</button>`;
  } else if(locked) actions=`<div class="lock-note">Durak kurmak için seviye ${sel.level} gerekir.</div>`;
  else actions=`<button class="btn btn-y btn-block" data-act="buy-stand" data-id="${sel.id}">Durak kur · ${tl(sel.standCost)}</button>`;
  return `<div class="map-layout">
    <div class="map-board"><div class="bosphorus"></div><div class="bridge" style="top:22%"></div><div class="bridge" style="top:48%"></div>${marks}</div>
    <div class="map-info">
      <div class="card">
        <div class="side-tag">${sel.side==="avrupa"?"Avrupa Yakası":"Anadolu Yakası"}</div>
        <h3 style="margin-top:4px;font-size:16px;text-transform:none;letter-spacing:0;color:var(--text)">${esc(sel.name)}</h3>
        <div class="kv" style="margin:8px 0">
          <span class="pill pill-g">İtibar %${Math.round(state.itibar[sel.id]||0)}</span>
          <span class="pill pill-b">Yoğunluk ${sel.density}/4</span>
          <span class="pill pill-y">Prestij ${sel.prestige}/5</span>
          ${owned?`<span class="pill pill-g">DURAK Lv.${st.level} · kap. ${standCap(st)}</span>`:""}
        </div>
        <div class="bar" style="margin-bottom:8px"><i style="width:${state.itibar[sel.id]||0}%"></i></div>
        ${owned?`<div class="dim" style="margin-bottom:8px">Aylık durak aidatı ${tl(standFee(st))} · Bu durakta ${taxisAt(sel.id).length} taksi</div>`:`<div class="dim" style="margin-bottom:8px">Durak bedeli ${tl(sel.standCost)}</div>`}
        ${rival?`<p class="muted">⚔️ Rakip: ${esc(rival.name)} (güç ${rival.power}/3) talebi kesiyor.</p>`:""}
        ${evHere?`<p class="muted">📢 Bugünkü olay bu semti etkiliyor.</p>`:""}
        ${weekHere?`<p class="muted">⭐ ${esc(state.weekly.name)}</p>`:""}
        ${actions}
      </div>
      <div class="card"><h3>Haftalık olay</h3><p>${esc(state.weekly?state.weekly.name:"Bu hafta sakin.")}</p>
        <p class="dim" style="margin-top:4px">Yeşil kenarlı semtler durakların. Kapasiteyi aşan filo verimsizleşir.</p>
      </div>
    </div>
  </div>`;
}

function skillStars(n){return "★".repeat(n)+"☆".repeat(5-n)}
function renderSofor(){
  const hired=state.drivers.map(d=>{
    const t=d.taxiId?taxiById(d.taxiId):null;
    const opts=[`<option value="">— Taksi seç —</option>`].concat(
      state.taxis.map(tx=>`<option value="${tx.id}" ${d.taxiId===tx.id?"selected":""}>${esc(tx.plate)} · ${esc(carById(tx.modelId).name)}</option>`)
    ).join("");
    const tr=(d.traits||[]).map(id=>{const x=TRAITS.find(z=>z.id===id);return x?x.name:id}).join(", ");
    const cost=4000+d.trainLvl*2500;
    return `<div class="card">
      <div class="row">
        <div class="driver-ava">${avaSvg(makeAva("regular"),40)}</div>
        <div style="flex:1;min-width:0">
          <div class="spread"><b>${esc(d.name)}</b><span class="pill pill-o">${tl(d.salary)}/ay</span></div>
          <div class="dim">Beceri ${skillStars(d.skill)} · Dürüstlük ${d.honesty||3}/5 · ${esc(tr)}</div>
          <div class="dim">Yorgunluk %${Math.round(d.fatigue||0)} · Moral %${Math.round(d.morale||70)} · ${t?t.plate:"Atanmamış"}</div>
          <div class="bar ${condClass(100-(d.fatigue||0))}" style="margin-top:4px"><i style="width:${100-(d.fatigue||0)}%"></i></div>
        </div>
        <div class="col">
          <button class="btn btn-g btn-xs" data-act="train" data-id="${d.id}">Eğit ${tl(cost)}</button>
          <button class="btn btn-g btn-xs" data-act="rest" data-id="${d.id}">Dinlendir</button>
          <button class="btn btn-d btn-xs" data-act="fire" data-id="${d.id}">Çıkar</button>
        </div>
      </div>
      <select data-act="assign" data-id="${d.id}" style="margin-top:8px;width:100%;background:#0c1322;border:1px solid var(--line);border-radius:8px;padding:8px">${opts}</select>
    </div>`;
  }).join("");
  const market=state.marketDrivers.map(d=>{
    const tr=(d.traits||[]).map(id=>{const x=TRAITS.find(z=>z.id===id);return x?x.name:id}).join(", ");
    return `<div class="card row">
      <div class="driver-ava">${avaSvg(makeAva("regular"),40)}</div>
      <div style="flex:1">
        <div class="spread"><b>${esc(d.name)}</b><span class="pill pill-o">${tl(d.salary)}/ay</span></div>
        <div class="dim">Beceri ${skillStars(d.skill)} · ${esc(tr)} · dürüstlük ${d.honesty||3}/5</div>
      </div>
      <button class="btn btn-y btn-sm" data-act="hire" data-id="${d.id}">İşe al</button>
    </div>`;
  }).join("");
  return `<div class="view-pad">
    <div class="spread" style="margin-bottom:8px"><h3 style="margin:0">Filo şoförleri</h3><span class="dim">Yorgunluk ve moral kazancı etkiler</span></div>
    <div class="list">${hired||"<p class='muted'>Henüz şoförün yok.</p>"}</div>
    <h3 style="margin:12px 0 8px">İş arayanlar</h3>
    <div class="list">${market||"<p class='muted'>Şu an aday yok. Birkaç güne bak.</p>"}</div>
  </div>`;
}

  return `<div class="view-pad">
    <div class="stat-grid" style="margin-bottom:10px">
      <div class="stat"><b class="${state.cash<0?"money out":"money"}">${tl(state.cash)}</b><span>Nakit</span></div>
      <div class="stat"><b class="money">${tl(state.bank)}</b><span>Mevduat (%3/ay)</span></div>

          <button class="btn btn-y btn-sm btn-block" data-act="bank-in" data-n="5000">Yatır 5.000 TL</button>
          <button class="btn btn-y btn-sm btn-block" data-act="bank-in" data-n="10000">Yatır 10.000 TL</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button class="btn btn-g btn-sm btn-block" data-act="bank-out" data-n="5000">Çek 5.000 TL</button>
          <button class="btn btn-g btn-sm btn-block" data-act="bank-out" data-n="10000">Çek 10.000 TL</button>
        </div>
        <button class="btn btn-g btn-sm btn-block" style="margin-top:6px" data-act="bank-in-all">Tüm nakdi yatır</button>
      </div>
      <div class="card"><h3>Kredi</h3>
        <p class="dim" style="margin-bottom:8px">Limit ${tl(maxLoan())} (seviye × 50.000 TL). Aylık faiz %6.</p>
        <div class="row">
          <button class="btn btn-y btn-sm btn-block" data-act="loan-take" data-n="10000">Çek 10.000 TL</button>
          <button class="btn btn-y btn-sm btn-block" data-act="loan-take" data-n="25000">Çek 25.000 TL</button>
        </div>
        <div class="row" style="margin-top:6px">
          <button class="btn btn-g btn-sm btn-block" data-act="loan-pay" data-n="10000">Öde 10.000 TL</button>
          <button class="btn btn-g btn-sm btn-block" data-act="loan-pay-all">Tümünü kapat</button>
        </div>
      </div>

function renderMagaza(){
  const rows=SHOP.map(u=>{
    const has=!!state.upgrades[u.id];
    return `<div class="card spread"><div><b>${esc(u.name)}</b><div class="dim">${esc(u.desc)}</div></div>
      ${has?`<span class="pill pill-g">ALINDI</span>`:`<button class="btn btn-y btn-sm" data-act="buy-up" data-id="${u.id}">${tl(u.price)}</button>`}
    </div>`;
  }).join("");
  return `<div class="view-pad"><p class="dim" style="margin-bottom:8px">Yükseltmeler tüm filoya uygulanır.</p><div class="list">${rows}</div></div>`;
}

function openModal(html){const m=$("#modal");m.innerHTML=`<div class="box">${html}</div>`;m.classList.remove("hidden");paused=true}
function closeModal(){$("#modal").classList.add("hidden");$("#modal").innerHTML="";if(!ride) paused=false}
function openSettings(){
  openModal(`<h2>Ayarlar</h2>
    <p class="muted" style="margin-bottom:10px">Kayıt bu tarayıcıda saklanır. v1 kayıtların otomatik taşınır.</p>
    <div class="col">
      <button class="btn btn-g btn-block" data-act="toggle-sound">Ses: ${state.sound?"Açık":"Kapalı"}</button>
      <button class="btn btn-g btn-block" data-act="rename">Adı değiştir</button>
      <button class="btn btn-g btn-block" data-act="open-ach">Rozetler</button>
      <button class="btn btn-d btn-block" data-act="confirm-reset">Oyunu sıfırla</button>
      <button class="btn btn-y btn-block" data-act="close-modal">Kapat</button>
    </div>`);
}
function openAch(){
  const items=ACHIEVEMENTS.map(a=>{
    const on=state.achievements.includes(a.id)||(a.check&&a.check(state));
    if(on&&!state.achievements.includes(a.id)) state.achievements.push(a.id);
    return `<div class="badge ${on?"on":""}"><span class="ic">${a.ic}</span>${esc(a.name)}<div class="dim">${esc(a.desc)}</div></div>`;
  }).join("");
  openModal(`<h2>Rozetler</h2><div class="badge-grid">${items}</div>
    <button class="btn btn-y btn-block" style="margin-top:12px" data-act="close-modal">Kapat</button>`);
}
function openDayModal(rep){
  const lines=(rep&&rep.report&&rep.report.length)?rep.report.map(r=>`<div class="result-line"><span>${esc(r)}</span></div>`).join(""):
    `<p class="muted">Bugün pasif kazanç yok. Şoför ata, akşamı bekle.</p>`;
  openModal(`<h2>Gün bitti</h2>
    <p class="muted" style="margin-bottom:8px">${state.day}. gün sabahı · ${clockStr(state.minutes)}</p>
    ${lines}
    <div class="result-line"><span>Gelir</span><span class="money">${tl(rep?rep.income:0)}</span></div>
    <div class="result-line"><span>Gider</span><span class="money out">${tl(rep?rep.expense:0)}</span></div>
    <div class="result-line total"><span>Net</span><span class="${(rep?(rep.income-rep.expense):0)<0?"money out":"money"}">${tl(rep?(rep.income-rep.expense):0)}</span></div>
    <button class="btn btn-y btn-block" style="margin-top:10px" data-act="close-day">Sabaha devam</button>`);
}
function openMonthModal(m,dayRep){
  openModal(`<h2>Ay sonu hesabı</h2><p class="muted">${state.month}. ay başladı</p>
    <div class="result-line"><span>Kira gideri</span><span class="money out">-${tl(m.rent)}</span></div>
    <div class="result-line"><span>Şoför maaşları</span><span class="money out">-${tl(m.salary)}</span></div>
    <div class="result-line"><span>Durak aidatları</span><span class="money out">-${tl(m.standFees)}</span></div>
    <div class="result-line"><span>Sigorta primleri</span><span class="money out">-${tl(m.insure)}</span></div>
    <div class="result-line"><span>Kredi faizi</span><span class="money out">-${tl(m.interest)}</span></div>
    <div class="result-line"><span>Mevduat faizi</span><span class="money">+${tl(m.bankInt)}</span></div>
    ${dayRep&&dayRep.total?`<div class="result-line"><span>Şoför kazancı</span><span class="money">+${tl(dayRep.total)}</span></div>`:""}
    <div class="result-line total"><span>Nakit</span><span class="${state.cash<0?"money out":"money"}">${tl(state.cash)}</span></div>
    <button class="btn btn-y btn-block" style="margin-top:10px" data-act="close-modal">Tamam</button>`);
}
function openRaiseModal(d){
  openModal(`<h2>Zam talebi</h2>
    <p>${esc(d.name)} maaş artışı istiyor: <b>${tl(d.salary)}</b> → <b>${tl(d.salary+d._raise)}</b>.</p>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-g btn-block" data-act="raise-no" data-id="${d.id}">Reddet</button>
      <button class="btn btn-y btn-block" data-act="raise-yes" data-id="${d.id}">Kabul et</button>
    </div>`);
}

function initStartArt(){
  const el=$("#start-art"); if(!el) return;
  el.innerHTML=`<div style="position:absolute;left:0;right:0;bottom:58px;height:80%;">
    ${buildingHtml()}${mosqueSvg()}
    <div style="position:absolute;left:6%;bottom:0;z-index:3">${taxiSvg("klia","34 TKS 17",{w:180,h:70,uid:"s1"})}</div>
    <div style="position:absolute;left:36%;bottom:0;z-index:3">${taxiSvg("vita","34 VIP 07",{w:200,h:74,uid:"s2"})}</div>
    <div style="position:absolute;left:68%;bottom:0;z-index:3">${taxiSvg("dobla","34 DBL 22",{w:190,h:72,uid:"s3"})}</div>
  </div>`;
}

function onClick(e){
  const btn=e.target.closest("[data-act]"); if(!btn) return;
  const act=btn.getAttribute("data-act"), id=btn.getAttribute("data-id"), kind=btn.getAttribute("data-kind"), n=Number(btn.getAttribute("data-n")||0);
  if(act!=="tap-now") sfx("click");
  if(act==="new-game"){
    if(load()){openModal(`<h2>Yeni oyun?</h2><p class="muted">Kayıtlı ilerlemen silinir.</p>
      <div class="row" style="margin-top:10px"><button class="btn btn-g btn-block" data-act="close-modal">Vazgeç</button>
      <button class="btn btn-d btn-block" data-act="force-new">Sil ve başla</button></div>`);return}
    startNewGame($("#pname").value.trim()||"İzzet");
  } else if(act==="force-new"){closeModal();wipeSave();startNewGame($("#pname").value.trim()||"İzzet")}
  else if(act==="continue") continueGame();
  else if(act==="wipe-from-start") openModal(`<h2>Kayıt silinsin mi?</h2><div class="row" style="margin-top:10px"><button class="btn btn-g btn-block" data-act="close-modal">Vazgeç</button><button class="btn btn-d btn-block" data-act="wipe-yes">Sil</button></div>`);
  else if(act==="wipe-yes"){wipeSave();closeModal();$("#btn-continue").classList.add("hidden");$("#btn-wipe").classList.add("hidden");toast("Kayıt silindi.")}
  else if(act==="nav"){view=id;renderAll()}
  else if(act==="yolcu-al") startRide();
  else if(act==="skip-day") skipToMorning();
  else if(act==="greet") chooseGreet(id);
  else if(act==="mid") chooseMid(id);
  else if(act==="ride-ev") chooseRideEv(id);
  else if(act==="tap-now") resolveTap();
  else if(act==="ride-close") closeRide();
  else if(act==="garaj-tab"){state.garajTab=id;renderAll()}
  else if(act==="galeri-tab"){state.galeriTab=id;renderAll()}
  else if(act==="buy-car") buyCar(id,kind);
  else if(act==="sell") sellTaxi(id);
  else if(act==="confirm-sell") confirmSell(id);
  else if(act==="wheel") takeWheel(id);
  else if(act==="repair") doRepair(id);
  else if(act==="fuel") doFuel(id);
  else if(act==="service") doService(id);
  else if(act==="insure") toggleInsure(id);
  else if(act==="hire") hireDriver(id);
  else if(act==="fire") fireDriver(id);
  else if(act==="train") trainDriver(id);
  else if(act==="rest") restDriver(id);
  else if(act==="sel-dist"){selectedDistrict=id;renderAll()}
  else if(act==="buy-stand") buyStand(id);
  else if(act==="up-stand") upgradeStand(id);
  else if(act==="go-stand") goStand(id);
  else if(act==="bank-in") bankDeposit(n);
  else if(act==="bank-in-all"){if(state.cash>0) bankDeposit(state.cash)}
  else if(act==="bank-out") bankWithdraw(n);
  else if(act==="loan-take") takeLoan(n);
  else if(act==="loan-pay") repayLoan(n);
  else if(act==="loan-pay-all") repayLoan(state.loan);
  else if(act==="buy-up") buyUpgrade(id);
  else if(act==="buy-plate"){
    const sel=btn.parentElement.querySelector("select");
    buyPlate(id, sel?sel.value:null);
  } else if(act==="open-settings") openSettings();
  else if(act==="open-ach") openAch();
  else if(act==="close-modal") closeModal();
  else if(act==="close-day"){
    closeModal();
    if(state._pendingRaise){const d=state._pendingRaise;state._pendingRaise=null;openRaiseModal(d)}
  } else if(act==="raise-yes") acceptRaise(id,true);
  else if(act==="raise-no") acceptRaise(id,false);
  else if(act==="item-return") itemReturn();
  else if(act==="item-keep") itemKeep();
  else if(act==="toggle-sound"){state.sound=!state.sound;save();openSettings()}
  else if(act==="rename") openModal(`<h2>Adını değiştir</h2>
    <input id="rename-in" maxlength="18" value="${esc(state.name)}" style="width:100%;background:#0c1322;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0">
    <div class="row"><button class="btn btn-g btn-block" data-act="open-settings">Geri</button>
    <button class="btn btn-y btn-block" data-act="rename-ok">Kaydet</button></div>`);
  else if(act==="rename-ok"){const v=($("#rename-in")?.value||"").trim().slice(0,18);if(v){state.name=v;save()}closeModal();renderAll()}
  else if(act==="confirm-reset") openModal(`<h2>Emin misin?</h2><p class="muted">Tüm ilerleme silinir.</p>
    <div class="row" style="margin-top:10px"><button class="btn btn-g btn-block" data-act="open-settings">Vazgeç</button>
    <button class="btn btn-d btn-block" data-act="do-reset">Sıfırla</button></div>`);
  else if(act==="do-reset"){
    closeModal(); wipeSave(); if(tickTimer) clearInterval(tickTimer); state=null;
    $("#screen-game").classList.add("hidden"); $("#screen-start").classList.remove("hidden");
    $("#btn-continue").classList.add("hidden"); $("#btn-wipe").classList.add("hidden"); toast("Oyun sıfırlandı.");
  }
}
function onChange(e){
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.getAttribute("data-act")==="assign") assignDriver(el.getAttribute("data-id"), el.value||null);
}
function boot(){
  initStartArt();
  const saved=load();
  if(saved){$("#pname").value=saved.name||"İzzet";$("#btn-continue").classList.remove("hidden");$("#btn-wipe").classList.remove("hidden")}
  document.addEventListener("click",onClick);
  document.addEventListener("change",onChange);
  document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!$("#modal").classList.contains("hidden")) closeModal()});
}
window.__TAKSI__={
  getState:()=>state,
  setState:(p)=>{Object.assign(state,p);save();renderAll()},
  startNewGame,continueGame,startRide,closeRide,skipToMorning,
  buyCar,buyStand,upgradeStand,hireDriver,assignDriver,takeWheel,trainDriver,
  bankDeposit,takeLoan,buyUpgrade,doRepair,doFuel,doService,toggleInsure,
  goView:(v)=>{view=v;renderAll()},
  getRide:()=>ride,
  speedRide:()=>{if(ride) ride.driveMs=800},
  forceNight:()=>{state.minutes=21*60+30;renderAll()},
  forceEvent:(id)=>{if(ride){ride._forceEvent=RIDE_EVENTS.find(e=>e.id===id)||RIDE_EVENTS[0];ride.eventAt=0.05}},
  startTypedRide:(type)=>startRide(PAX_TYPES[type]||PAX_TYPES.tourist),
  tl,QUESTS,CARS,DISTRICTS,PAX_TYPES,RIDE_EVENTS,ACHIEVEMENTS
};
boot();
</script>
